# Autor: Elmer Fuentes. MySQL DEV aislado del servicio Windows.
name: ef-solutions-mysql-dev
services:
  mysql:
    image: mysql:8.4.13
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${EF_MYSQL_ROOT_PASSWORD:?Define EF_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: EF_DEV
    volumes:
      - mysql_dev_data:/var/lib/mysql
volumes:
  mysql_dev_data:
