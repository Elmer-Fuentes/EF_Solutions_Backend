name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore EF.Solutions.slnx
      - run: dotnet build EF.Solutions.slnx --no-restore --configuration Release
      - run: dotnet test EF.Solutions.slnx --no-build --configuration Release
