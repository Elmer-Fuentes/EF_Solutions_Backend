name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'feature/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore EF.Solutions.slnx
      - run: dotnet format whitespace EF.Solutions.slnx --no-restore --verify-no-changes
      - run: dotnet build EF.Solutions.slnx --no-restore --configuration Release
      - run: dotnet test EF.Solutions.slnx --no-build --configuration Release
      - name: Verificar contrato HTTP en Development
        env:
          DOTNET_ENVIRONMENT: Development
          EF_DATABASE__PROVIDER: MySql
          EF_DATABASE__HOST: 127.0.0.1
          EF_DATABASE__PORT: '1'
          EF_DATABASE__NAME: EF_DEV
          EF_DATABASE__USERNAME: ef_ci
          EF_DATABASE__PASSWORD: local-ci-placeholder
          EF_DATABASE__SSL_MODE: Preferred
        run: |
          dotnet run --project EF.Solutions.Web --configuration Release --no-build --no-launch-profile -- --urls http://127.0.0.1:5257 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:5257/health
          pwsh -NoProfile -File Tests/IntegrationTests/VerificarApiDev.ps1
